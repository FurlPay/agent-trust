# Publish to npm via Trusted Publishing (OIDC). No npm token exists anywhere in
# this repo, and none should be created — a long-lived automation token is the
# credential this workflow exists to avoid.
#
# HOW IT WORKS
#   tag push -> Actions -> GitHub OIDC identity -> npm trusted publisher -> publish
#
# Provenance is AUTOMATIC under trusted publishing. Do not add `--provenance`:
# npm generates and publishes the SLSA attestation itself when the publish comes
# from a configured trusted publisher on a public repo. The flag is only needed
# on the older token-based path.
#
# ONE-TIME SETUP ON NPMJS.COM (not done yet — see BLOCKED below)
#   Package settings -> Trusted Publisher -> GitHub Actions:
#     Organization/user : FurlPay
#     Repository        : <this repo>
#     Workflow filename : release.yml     (filename only, with extension)
#     Environment       : release
#
# BLOCKED, and this is why the workflow is committed but unproven:
# GitHub Actions is billing-locked account-wide — every job reports "not started
# because your account is locked due to a billing issue". This file has NEVER
# executed. Until it does, no package here has provenance, and nothing should
# claim otherwise.
#
# Requirements per npm docs: npm CLI >= 11.5.1, Node >= 22.14.0.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # REQUIRED — this is what mints the OIDC token

jobs:
  publish:
    runs-on: ubuntu-latest
    # A GitHub Environment lets a human approve the publish. Without it, anyone
    # who can push a tag can publish.
    environment: release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs a newer npm than the one bundled with Node 22.
      - run: npm install -g npm@latest
      - run: npm --version

      # The tarball is the artifact. Everything below gates it.
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx tsc -p tsconfig.json --noEmit

      # Refuse to publish a tag that disagrees with package.json. A mismatch here
      # means the tag and the tarball describe different releases.
      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG != package.json $PKG"; exit 1
          fi

      # Fail before publishing rather than after, if the version is already taken.
      - name: Version must not already exist on npm
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VER="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "$NAME@$VER is already published"; exit 1
          fi

      - run: npm pack --dry-run

      # No NODE_AUTH_TOKEN. The OIDC exchange is the credential.
      - run: npm publish --access public
